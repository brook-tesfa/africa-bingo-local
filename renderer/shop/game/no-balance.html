<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'none'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'none'; object-src 'none'; frame-src 'none'; base-uri 'none'; form-action 'none'">
  <title>Local Credit Required</title>
  <link rel="icon" href="../../../img/logo.png" type="image/png">
  <style>
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      background: radial-gradient(circle at top, #45465b, #141415 65%);
      color: #fff;
      font-family: Arial, sans-serif;
      text-align: center;
    }
    main { width: min(520px, 100%); padding: 40px; border-radius: 22px; background: #23242c; box-shadow: 0 18px 55px #0008; }
    img { width: 88px; height: 88px; object-fit: contain; }
    h1 { margin: 18px 0 10px; }
    p { color: #c9cad4; line-height: 1.55; }
    a { display: inline-block; margin-top: 18px; padding: 13px 22px; border-radius: 12px; background: #8067f3; color: #fff; text-decoration: none; font-weight: 700; }
  </style>
</head>
<body>
  <main>
    <img src="../../../img/logo.png" alt="Africa Bingo logo">
    <h1>Local credit required</h1>
    <p>Redeem a signed, device-bound voucher from the local dashboard before starting another game. No internet server is used.</p>
    <a href="../dashboard/control.html">Return to dashboard</a>
  </main>
</body>
</html>
