function updateLetterCode() {
    const count = selected_cards.length; // how many selected
    const letterDisplay = document.getElementById("letter_a");

    if (!letterDisplay) return;

    // Convert count number → letters
    const letterCode = count
        .toString()
        .split("")
        .map(digit => letters[parseInt(digit)])
        .join("");

    letterDisplay.textContent = letterCode;

        // Define audio files for selection and deselection
const selectSound = new Audio('audio/bip.mp3'); 


function playSound(sound) {
    // Check if the sound is already playing and stop it to allow a new one to play
    sound.pause();
    sound.currentTime = 0;
    sound.play();
}

        function displayCartela() {
            const container = document.querySelector('.cartela_container');
            const popup = document.getElementById('popup');
            container.innerHTML = '';

            cartela_codes.forEach((number) => {
                const item = document.createElement('div');
                item.classList.add('cartela_item');
                item.textContent = number;
                item.dataset.number = number;

                item.addEventListener('click', () => {
                    toggleCardSelection(number);
                    popup.textContent = number;
                    popup.style.display = "flex";

                    setTimeout(() => {
                        popup.style.display = "none";
                    }, 800);
                });

                container.appendChild(item);
            });

            // Re-mark previously selected cards on display
            selected_cards.forEach(number => {
                const item = document.querySelector(`.cartela_item[data-number="${number}"]`);
                if (item) {
                    item.classList.add('cartela_item_selected');
                }
            });
        }

        function toggleCardSelection(cardNumber) {
            const item = document.querySelector(`.cartela_item[data-number="${cardNumber}"]`);

            if (selected_cards.includes(cardNumber)) {
                const index = selected_cards.indexOf(cardNumber);
            
                if (index > -1) {
                    selected_cards.splice(index, 1);
                    if (item) item.classList.remove('cartela_item_selected');
                        playSound(selectSound);
                        updateLetterCode(); 
                        
                }
            } else {
                selected_cards.push(cardNumber);
                if (item) item.classList.add('cartela_item_selected');
                    playSound(selectSound);
                      updateLetterCode(); 
                        
            }
            console.log("Selected Cards:", selected_cards);
            window.api.mobileRoomSetCard(cardNumber, selected_cards.includes(cardNumber))
                .catch(error => console.warn('Could not update the mobile cartela room:', error));
        }

        function applyMobileRoomSelections(cards) {
            const next = Array.from(new Set((cards || [])
                .map(Number)
                .filter(number => Number.isInteger(number) && number >= 1 && number <= 150)))
                .sort((a, b) => a - b);
            selected_cards = next;
            document.querySelectorAll('.cartela_item').forEach(item => {
                const cardNumber = Number(item.dataset.number);
                item.classList.toggle('cartela_item_selected', next.includes(cardNumber));
            });
            updateLetterCode();
        }

        window.api.onMobileRoomCardChange(change => {
            if (!change || change.source !== 'mobile') return;
            const next = new Set(selected_cards);
            if (change.selected) next.add(Number(change.cardId));
            else next.delete(Number(change.cardId));
            applyMobileRoomSelections([...next]);
        });

        function updateTopText(state, number = '') {
            if (state === 'taken') {
                topTextElement.textContent = `ያስገቡት ካርቴላ ተይዟል`;
                topTextElement.style.color = 'red';

                topTextElement.textContent = 'ከ1 እስክ 150 ያለ ቁጥር ይምረጡ';
                topTextElement.style.color = '#c3c3c3';
            } else if (state === 'out_of_range') {
                topTextElement.textContent = 'ከ1 እስክ 150 ያለ ቁጥር ይምረጡ';
                topTextElement.style.color = 'red';
            }
        }

        // Add event listener for text input
        inputElement.addEventListener('keydown', function (event) {
            if (event.key === 'Enter') {
                event.preventDefault(); // Prevents form submission
                const inputValue = parseInt(this.value, 10);

                if (isNaN(inputValue) || inputValue < 1 || inputValue > 150) {
                    updateTopText('out_of_range');
                    return;
                }

                const cardItem = document.querySelector(`.cartela_item[data-number="${inputValue}"]`);

                if (cardItem) {
                    if (selected_cards.includes(inputValue)) {
                        updateTopText('taken', inputValue);
                    } else {
                        toggleCardSelection(inputValue);
                        this.value = ''; // Clear the input field
                        updateTopText('default'); // Reset text to default after successful selection
                    }
                }
            }
        });

document.querySelector(".start_button").addEventListener("click", async function () {
    if (selected_cards.length > 0) {
        const playersCount = selected_cards.length;
        let commissionResult;
        try {
            commissionResult = await window.api.calculateGameCommission(playersCount);
        } catch (error) {
            commissionResult = { success: false, message: error.message };
        }
        if (!commissionResult?.success) {
            topTextElement.textContent = commissionResult?.message || "Could not calculate the local commission.";
            topTextElement.style.color = "red";
            return;
        }

        const commissionPercentage = Number(commissionResult.percent);

// ==============================
// IndexedDB Helpers
// ==============================
function openDB() {
    return new Promise((resolve, reject) => {
        const request = indexedDB.open("GameAudioDB", 1);

        request.onupgradeneeded = (event) => {
            const db = event.target.result;
            if (!db.objectStoreNames.contains("audios")) {
                db.createObjectStore("audios");
            }
        };

        request.onsuccess = (event) => resolve(event.target.result);
        request.onerror = (event) => reject(event.target.error);
    });
}

async function saveAudio(key, blob) {
    const db = await openDB();
    return new Promise((resolve, reject) => {
        const tx = db.transaction("audios", "readwrite");
        tx.objectStore("audios").put(blob, key);
        tx.oncomplete = () => resolve();
        tx.onerror = (event) => reject(event.target.error);
    });
}

async function getAudio(key) {
    const db = await openDB();
    return new Promise((resolve, reject) => {
        const tx = db.transaction("audios", "readonly");
        const request = tx.objectStore("audios").get(key);
        request.onsuccess = () => resolve(request.result);
        request.onerror = (event) => reject(event.target.error);
    });
}

    if (cached) {

async function preloadSmallSounds() {
    // Check if any sound is missing
    let anyMissing = false;
    for (let i = 0; i < smallSounds.length; i++) {
        const key = `effect-${smallSounds[i]}`;
        const cached = await getAudio(key);
        if (!cached) {
            anyMissing = true;
            break;
        }
    }

    // If all sounds are cached, just load them
    if (!anyMissing) {
        for (let i = 0; i < smallSounds.length; i++) {
            const name = smallSounds[i];
            const key = `effect-${name}`;
            const cached = await getAudio(key);
            if (cached) {
                smallAudioObjects[name] = new Audio(URL.createObjectURL(cached));
            }
        }
        return;
    }

    // Otherwise, download missing ones
    for (let i = 0; i < smallSounds.length; i++) {
        const name = smallSounds[i];
        const key = `effect-${name}`;
        let cached = await getAudio(key);

        if (!cached) {
            try {
                const response = await fetch(`audio/${name}.mp3`);
                const blob = await response.blob();
                await saveAudio(key, blob);
                cached = blob;
            } catch (err) {
                console.error(`Failed to preload ${name}`, err);
            }
        }

        if (cached) {
            smallAudioObjects[name] = new Audio(URL.createObjectURL(cached));
        }
    }
}

function highlightBingo(card, numbers) {
  const gridItems = document.querySelectorAll(".numbers_grid .number_item, .number_item_green");

  const bingoCells = new Set();
  let bingoLines = 0;

  // --- Rows ---

      if (card[r].every(num => numbers.includes(num) || num === "F")) {
        bingoLines++;
        for (let c = 0; c < 5; c++) bingoCells.add(`${r}-${c}`);
      }
    }
  }

  // --- Columns ---
  if (rules.columns) {
    for (let c = 0; c < 5; c++) {
      if (card.every(row => numbers.includes(row[c]) || row[c] === "F")) {
        bingoLines++;
        for (let r = 0; r < 5; r++) bingoCells.add(`${r}-${c}`);
      }
    }
  }

  // --- Diagonals ---
  if (rules.diagonals) {
    if (card.every((row, idx) => numbers.includes(row[idx]) || row[idx] === "F")) {
      bingoLines++;
      for (let d = 0; d < 5; d++) bingoCells.add(`${d}-${d}`);
    }
    if (card.every((row, idx) => numbers.includes(row[4 - idx]) || row[4 - idx] === "F")) {
      bingoLines++;
      for (let d = 0; d < 5; d++) bingoCells.add(`${d}-${4 - d}`);
    }
  }

  // --- Corners ---
  if (rules.corners) {
    const corners = [card[0][0], card[0][4], card[4][0], card[4][4]];
    if (corners.every(num => numbers.includes(num) || num === "F")) {
      bingoLines++;
      bingoCells.add("0-0"); bingoCells.add("0-4"); bingoCells.add("4-0"); bingoCells.add("4-4");
    }
  }

  // --- Middle 4 ---
  if (rules.middle) {
    const middleCoords = [[1,1],[1,3],[3,1],[3,3]];
    const middleNumbers = middleCoords.map(([r,c]) => card[r][c]);
    if (middleNumbers.every(num => numbers.includes(num) || num === "F")) {
      bingoLines++;
      middleCoords.forEach(([r,c]) => bingoCells.add(`${r}-${c}`));
    }
  }

  // --- Cross rule (new) ---
  if (rules.cross) {
    const crossCoords = [[1,2],[2,1],[2,3],[3,2]];
    const crossNumbers = crossCoords.map(([r,c]) => card[r][c]);
    if (crossNumbers.every(num => numbers.includes(num) || num === "F")) {
      bingoLines++;
      crossCoords.forEach(([r,c]) => bingoCells.add(`${r}-${c}`));
    }

  index = 0;

function showBalanceNotification(message) {
    const notif = document.getElementById("balanceNotification");
    if (!notif) return;

    notif.innerText = message;
    notif.classList.add("show");

    setTimeout(() => {
        notif.classList.remove("show");
    }, 7000); // hide after 5s
}

window.addEventListener("load", () => {
    // Check if the IPC bridge (api) and function are available
    if (window.api && window.api.notifyBalance) {
        // Use the exposed IPC function to get data from the main process
        window.api.notifyBalance()
            .then(data => {
                // The data structure is compatible with the old PHP response: { status: 'low', message: '...' }
                if (data && data.status === "low") {
                    showBalanceNotification(data.message);
                } else if (data && data.status === "error") {
                    console.error("Balance check IPC error:", data.message);
                }
            })
            .catch(err => console.error("Balance check error:", err));
    } else {
        console.error("IPC API or notifyBalance function not available. Ensure preload.js is loaded correctly.");
    }
});
