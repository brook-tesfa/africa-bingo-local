<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; font-src 'self' data:; media-src 'self' data: blob:; object-src 'none'; frame-src 'none'; base-uri 'none'; form-action 'none'">
  <title>Africa Bingo Local</title>
  <link rel="shortcut icon" href="../img/logo.ico" type="image/x-icon">
  <link rel="icon" href="../img/logo.png" type="image/png">
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      font-family: "Segoe UI", Tahoma, sans-serif;
      background: linear-gradient(135deg, #f071d0, #6f56e8 55%, #24106f);
      color: #fff;
      display: grid;
      place-items: center;
      padding: 24px;
    }
    .shell { width: min(460px, 100%); }
    .brand { text-align: center; margin-bottom: 18px; }
    .brand img { width: 80px; height: 80px; object-fit: contain; }
    .brand h1 { margin: 6px 0 0; font-size: 1.9rem; }
    .offline-badge {
      display: inline-block;
      margin-top: 8px;
      padding: 6px 10px;
      border-radius: 999px;
      background: rgba(14, 34, 24, .65);
      border: 1px solid rgba(121, 255, 172, .55);
      color: #b8ffd0;
      font-size: .82rem;
      font-weight: 700;
      letter-spacing: .04em;
    }
    .panel {
      background: rgba(15, 13, 45, .72);
      border: 1px solid rgba(255,255,255,.26);
      border-radius: 20px;
      padding: 28px;
      box-shadow: 0 22px 60px rgba(0,0,0,.28);
      backdrop-filter: blur(12px);
    }
    h2 { margin: 0 0 18px; text-align: center; }
    label { display: block; margin: 12px 0 6px; font-size: .9rem; font-weight: 650; }
    input {
      width: 100%;
      padding: 12px 13px;
      border-radius: 9px;
      border: 1px solid rgba(255,255,255,.35);
      background: rgba(255,255,255,.1);
      color: #fff;
      font-size: 16px;
      outline: none;
    }
    input:focus { border-color: #fff; box-shadow: 0 0 0 3px rgba(255,255,255,.14); }
    .primary, .secondary {
      width: 100%;
      margin-top: 18px;
      padding: 12px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,.75);
      color: #fff;
      font-size: 16px;
      font-weight: 750;
      cursor: pointer;
    }
    .primary { background: linear-gradient(90deg, #d215a3, #3015b8); }
    .secondary { background: transparent; margin-top: 10px; }
    button:disabled { opacity: .55; cursor: wait; }
    .hint { margin: 8px 0 0; color: #dcd8ff; font-size: .84rem; line-height: 1.4; }
    .message { min-height: 22px; margin: 14px 0 0; text-align: center; font-weight: 650; }
    .message.error { color: #ffd1d1; }
    .message.success { color: #b9ffd0; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <main class="shell">
    <div class="brand">
      <img src="../img/logo.png" alt="Africa Bingo logo">
      <h1>Africa Bingo Local</h1>
      <span class="offline-badge">LOCAL HOTSPOT READY · INTERNET BLOCKED</span>
    </div>

    <section id="loginPanel" class="panel">
      <h2>Local Login</h2>
      <label for="username">Username</label>
      <input id="username" type="text" autocomplete="username" maxlength="50">
      <label for="password">Password</label>
      <input id="password" type="password" autocomplete="current-password">
      <button id="loginBtn" class="primary">Login</button>
      <button id="showCreateBtn" class="secondary">Create a local account</button>
      <p id="loginMessage" class="message" aria-live="polite"></p>
    </section>

    <section id="createPanel" class="panel hidden">
      <h2>Create Local Account</h2>
      <label for="newUsername">Username</label>
      <input id="newUsername" type="text" maxlength="50" autocomplete="off">
      <label for="newPassword">Password</label>
      <input id="newPassword" type="password" minlength="6" autocomplete="new-password">
      <label for="shopName">Shop name</label>
      <input id="shopName" type="text" maxlength="80" autocomplete="organization">
      <label for="shopAddress">Shop address</label>
      <input id="shopAddress" type="text" maxlength="120" value="Local">
      <p class="hint">New accounts start with zero credit. Send the device code to your provider and redeem a signed voucher from the dashboard.</p>
      <button id="createBtn" class="primary">Create account</button>
      <button id="showLoginBtn" class="secondary">Back to login</button>
      <p id="createMessage" class="message" aria-live="polite"></p>
    </section>
  </main>
  <script src="./js/login.js"></script>
</body>
</html>
