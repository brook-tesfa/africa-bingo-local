name: Windows release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify local-only behavior
        run: npm test

      - name: Build Windows installer
        run: npm run dist:win

      - name: Launch packaged Windows app
        shell: pwsh
        run: |
          $exe = Resolve-Path "dist/win-unpacked/Africa Bingo Local.exe"
          $process = Start-Process -FilePath $exe -ArgumentList "--smoke-test" -PassThru
          if (-not $process.WaitForExit(30000)) {
            Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
            throw "Packaged app did not reach a ready state within 30 seconds."
          }
          if ($process.ExitCode -ne 0) {
            $logs = @(
              "$env:APPDATA/Africa Bingo Local/logs/startup.log",
              "$env:APPDATA/africa-bingo-local/logs/startup.log"
            )
            foreach ($log in $logs) {
              if (Test-Path $log) { Get-Content $log }
            }
            throw "Packaged app exited with code $($process.ExitCode)."
          }

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" (Get-ChildItem dist/*.exe | ForEach-Object FullName) --title "Africa Bingo Local ${{ github.ref_name }}" --generate-notes
